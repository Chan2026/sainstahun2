<!DOCTYPE html>
<html lang="zh-MY">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球小探险家 - 一年级科学：地形 (Bentuk Muka Bumi)</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for friendly rounded typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', 'ZCOOL KuaiLe', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
            touch-action: manipulation;
        }

        .font-fun {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
        }

        /* Cute bounce animations */
        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .animate-bounce-gentle {
            animation: bounce-gentle 2s infinite ease-in-out;
        }

        @keyframes pulse-shake {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.05) rotate(-3deg); }
            40% { transform: scale(1.05) rotate(3deg); }
            60% { transform: scale(1.05) rotate(-3deg); }
            80% { transform: scale(1.05) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .shake-error {
            animation: pulse-shake 0.4s ease-in-out;
        }

        /* Custom card shadows and rounded corners */
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .selected-card {
            ring: 4px;
            ring-color: #3b82f6;
            transform: scale(1.03);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 md:p-6 text-slate-800 select-none">

    <!-- Top Header -->
    <header class="w-full max-w-4xl bg-white/80 backdrop-blur-md rounded-3xl p-4 mb-4 shadow-lg flex justify-between items-center border-4 border-yellow-300">
        <div class="flex items-center gap-3">
            <div class="bg-yellow-400 p-2 md:p-3 rounded-2xl text-2xl md:text-3xl animate-bounce-gentle">
                🌍
            </div>
            <div>
                <h1 class="text-xl md:text-3xl font-fun text-sky-600 tracking-wide">地球小探险家</h1>
                <p class="text-xs md:text-sm text-slate-500 font-semibold">一年级科学 单元9：地形 (Landforms)</p>
            </div>
        </div>

        <!-- Star Counter & Audio Toggle -->
        <div class="flex items-center gap-3">
            <div class="bg-amber-100 border-2 border-amber-300 px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-inner">
                <span class="text-xl">⭐</span>
                <span id="star-count" class="font-bold text-amber-600 text-lg md:text-xl">0 / 8</span>
            </div>
            <button id="sound-btn" onclick="toggleSound()" class="bg-sky-100 hover:bg-sky-200 text-sky-600 p-2 rounded-2xl border-2 border-sky-300 transition">
                🔊
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-4xl flex-1 flex flex-col gap-4">
        
        <!-- Mascot Instructions Banner -->
        <div class="bg-gradient-to-r from-sky-400 to-teal-400 rounded-3xl p-4 text-white shadow-md flex items-center gap-4 border-2 border-white">
            <div class="text-4xl md:text-5xl bg-white/20 p-2 rounded-2xl shrink-0">
                🦖
            </div>
            <div>
                <h2 class="font-bold text-base md:text-lg text-yellow-200">探险小任务：</h2>
                <p class="text-xs md:text-sm font-medium leading-relaxed">
                    点击下方正确的<span class="bg-yellow-300 text-slate-800 px-2 py-0.5 rounded-full font-bold">【地形名称】</span>，然后再点击对应的<span class="bg-white text-sky-600 px-2 py-0.5 rounded-full font-bold">【图片框】</span>完成配对吧！
                </p>
            </div>
        </div>

        <!-- Level Selector Tabs -->
        <div class="flex justify-center gap-3 my-1">
            <button id="btn-stage-1" onclick="switchStage(1)" class="px-5 py-2 rounded-2xl font-bold transition shadow-md bg-yellow-400 text-slate-900 border-b-4 border-yellow-600">
                第一关 (4种地形)
            </button>
            <button id="btn-stage-2" onclick="switchStage(2)" class="px-5 py-2 rounded-2xl font-bold transition shadow-md bg-white text-slate-500 border-b-4 border-slate-200">
                第二关 (4种地形)
            </button>
        </div>

        <!-- Image Cards Grid -->
        <div id="cards-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 my-2">
            <!-- Cards will be dynamically inserted by JavaScript -->
        </div>

        <!-- Word Choices Box -->
        <div class="bg-white/90 backdrop-blur-md rounded-3xl p-4 md:p-5 shadow-lg border-4 border-sky-200">
            <div class="text-center text-xs md:text-sm text-slate-400 font-bold mb-3 uppercase tracking-wider">
                👇 点击选择地形名称 (Select Landform) 👇
            </div>
            <div id="word-bank" class="flex flex-wrap justify-center gap-2 md:gap-3">
                <!-- Word buttons will be dynamically inserted by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Victory Modal -->
    <div id="victory-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl border-4 border-yellow-400 transform transition-all scale-95 animate-bounce-gentle">
            <div class="text-6xl mb-2">🎉🏆🌟</div>
            <h2 class="text-3xl font-fun text-yellow-500 mb-2">太棒了！全对啦！</h2>
            <p class="text-slate-600 mb-6 text-sm md:text-base">你真是一个出色的小小地理探险家！已经完全掌握一年级科学的所有地形知识了！</p>
            <button onclick="restartGame()" class="w-full py-3.5 bg-gradient-to-r from-green-400 to-emerald-500 text-white rounded-2xl font-bold text-lg shadow-lg hover:brightness-105 active:scale-95 transition border-b-4 border-green-700">
                🔄 再玩一次 (Main Lagi)
            </button>
        </div>
    </div>

    <!-- Canvas for Victory Confetti -->
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

    <!-- Footer -->
    <footer class="mt-4 text-center text-xs text-slate-500 font-medium">
        符合 KSSR Semakan 一年级科学课程标准 (Unit 9 Bentuk Muka Bumi)
    </footer>

    <script>
        // Landforms Data with Vector SVG graphics designed for 1st Graders
        const landformsData = [
            // Stage 1
            {
                id: 'gunung',
                stage: 1,
                title: '高山',
                enTitle: 'Mountain',
                svg: `<svg viewBox="0 0 200 160" class="w-full h-full">

            },
            {

                stage: 1,
                title: '海滩',
                enTitle: 'Beach',
                svg: `<svg viewBox="0 0 200 160" class="w-full h-full">
                    <rect width="200" height="160" fill="#bae6fd" rx="16"/>
                    <!-- Ocean water -->
                    <path d="M 0 60 Q 50 55 100 65 T 200 60 L 200 160 L 0 160 Z" fill="#38bdf8"/>
                    <!-- Sand -->
                    <path d="M 0 95 Q 60 90 120 110 T 200 100 L 200 160 L 0 160 Z" fill="#fde047"/>
                    <!-- Coconut Tree -->
                    <path d="M 160 140 Q 150 90 170 60" stroke="#9a3412" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path d="M 170 60 Q 140 40 120 50 M 170 60 Q 180 35 200 40 M 170 60 Q 195 70 190 90" stroke="#16a34a" stroke-width="6" fill="none" stroke-linecap="round"/>
                    <circle cx="165" cy="62" r="4" fill="#78350f"/>
                    <circle cx="172" cy="65" r="4" fill="#78350f"/>
                    <!-- Cute Starfish -->
                    <path d="M 50 125 L 53 132 L 60 132 L 55 136 L 57 143 L 50 139 L 43 143 L 45 136 L 40 132 L 47 132 Z" fill="#f43f5e"/>
                </svg>`
            },
            {
                id: 'sungai',
                stage: 1,
                title: '河流',
                enTitle: 'River',
                svg: `<svg viewBox="0 0 200 160" class="w-full h-full">
                    <rect width="200" height="160" fill="#86efac" rx="16"/>
                    <!-- Green grassy hills side -->
                    <circle cx="20" cy="40" r="35" fill="#4ade80"/>
                    <circle cx="180" cy="50" r="40" fill="#22c55e"/>
                    <!-- Winding River -->
                    <path d="M 90 0 C 110 40 30 80 110 160 L 150 160 C 70 90 150 40 120 0 Z" fill="#0284c7"/>
                    <!-- Duck on river -->
                    <circle cx="85" cy="105" r="7" fill="#facc15"/>
                    <circle cx="89" cy="101" r="5" fill="#facc15"/>
                    <path d="M 93 101 L 97 103 L 93 105 Z" fill="#ea580c"/>
                    <!-- Flowers -->
                    <circle cx="30" cy="110" r="5" fill="#f43f5e"/>
                    <circle cx="165" cy="120" r="5" fill="#a855f7"/>
                </svg>`
            },
            {
                id: 'tasik',
                stage: 1,
                title: '湖',
                enTitle: 'Lake',
                svg: `<svg viewBox="0 0 200 160" class="w-full h-full">
                    <rect width="200" height="160" fill="#86efac" rx="16"/>
                    <!-- Lake Body enclosed by land -->
                    <ellipse cx="100" cy="90" rx="75" ry="45" fill="#38bdf8"/>
                    <ellipse cx="100" cy="90" rx="65" ry="38" fill="#0284c7" opacity="0.3"/>
                    <!-- Trees around lake -->
                    <circle cx="30" cy="50" r="16" fill="#15803d"/>
                    <circle cx="165" cy="55" r="18" fill="#166534"/>
                    <circle cx="170" cy="115" r="14" fill="#15803d"/>

                    <!-- Sailboat on Lake -->
                    <path d="M 85 85 L 115 85 L 108 95 L 92 95 Z" fill="#b91c1c"/>
                    <polygon points="100,60 100,83 115,83" fill="#ffffff"/>
                </svg>`
            },
            // Stage 2
            {
                id: 'bukit',
                stage: 2,
                title: '山丘',
                enTitle: 'Hill',
                svg: `<svg viewBox="0 0 200 160" class="w-full h-full">
                    <rect width="200" height="160" fill="#e0f2fe" rx="16"/>
                    <circle cx="40" cy="40" r="15" fill="#fde047"/>
                    <!-- Gentle rolling green hills (Bukit / 山丘) -->
                    <path d="M -20 160 Q 40 70 110 160 Z" fill="#4ade80"/>
                    <path d="M 50 160 Q 130 60 220 160 Z" fill="#22c55e"/>
                    <!-- Small cute tree & flowers on hill -->
                    <circle cx="80" cy="120" r="12" fill="#16a34a"/>
                    <rect x="78" y="132" width="4" height="10" fill="#78350f"/>
                    <circle cx="120" cy="135" r="4" fill="#f43f5e"/>
                    <circle cx="140" cy="140" r="4" fill="#a855f7"/>
                </svg>`
            },
            {
                id: 'lembah',
                stage: 2,
                title: '山谷',
                enTitle: 'Valley',
                svg: `<svg viewBox="0 0 200 160" class="w-full h-full">
                    <rect width="200" height="160" fill="#e0f2fe" rx="16"/>
                    <!-- Two Mountains on sides -->
                    <polygon points="-20,160 50,40 120,160" fill="#64748b"/>
                    <polygon points="80,160 150,30 220,160" fill="#475569"/>
                    <!-- Low Valley floor in middle -->
                    <path d="M 0 160 L 60 130 Q 100 120 140 130 L 200 160 Z" fill="#86efac"/>
                    <!-- Small stream in valley -->
                    <path d="M 95 125 Q 100 140 105 160" stroke="#38bdf8" stroke-width="6" fill="none"/>
                </svg>`
            },
            {
                id: 'kolam',
                stage: 2,
                title: '池塘',
                enTitle: 'Pond',
                svg: `<svg viewBox="0 0 200 160" class="w-full h-full">
                    <rect width="200" height="160" fill="#86efac" rx="16"/>
                    <!-- Small round pond in park/garden -->
                    <ellipse cx="100" cy="95" rx="58" ry="34" fill="#38bdf8"/>
                    <ellipse cx="100" cy="95" rx="50" ry="28" fill="#0284c7" opacity="0.3"/>
                    <!-- Lily pads in pond -->
                    <ellipse cx="80" cy="95" rx="10" ry="6" fill="#22c55e"/>
                    <ellipse cx="115" cy="100" rx="8" ry="5" fill="#22c55e"/>
                    <!-- Cute Pink Lotus Flower -->
                    <circle cx="115" cy="98" r="4" fill="#f43f5e"/>
                    <!-- Cute Frog on bank -->
                    <circle cx="145" cy="85" r="7" fill="#15803d"/>
                    <circle cx="143" cy="82" r="2" fill="#ffffff"/>
                    <circle cx="147" cy="82" r="2" fill="#ffffff"/>
                    <!-- Bushes around pond -->
                    <circle cx="42" cy="75" r="14" fill="#16a34a"/>
                    <circle cx="155" cy="120" r="12" fill="#166534"/>
                </svg>`
            },
            {
                id: 'laut',
                stage: 2,
                title: '海',
                enTitle: 'Sea',
                svg: `<svg viewBox="0 0 200 160" class="w-full h-full">
                    <rect width="200" height="160" fill="#bae6fd" rx="16"/>
                    <!-- Sky with bright sun -->
                    <circle cx="170" cy="35" r="16" fill="#fde047"/>
                    <!-- Vast open ocean layers reaching the horizon -->
                    <rect x="0" y="65" width="200" height="95" fill="#0284c7"/>
                    <path d="M 0 75 Q 50 70 100 75 T 200 75 L 200 160 L 0 160 Z" fill="#0369a1"/>
                    <path d="M 0 100 Q 50 92 100 100 T 200 100 L 200 160 L 0 160 Z" fill="#075985"/>
                    <path d="M 0 130 Q 50 122 100 130 T 200 130 L 200 160 L 0 160 Z" fill="#0c4a6e"/>
                    <!-- Distant Ship on horizon -->
                    <polygon points="40,65 55,65 52,70 43,70" fill="#ffffff"/>
                    <line x1="48" y1="58" x2="48" y2="65" stroke="#ffffff" stroke-width="2"/>
                    <!-- Ocean wave sparkles -->
                    <path d="M 80 115 Q 90 110 100 115" stroke="#7dd3fc" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <path d="M 130 140 Q 140 135 150 140" stroke="#7dd3fc" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>`
            }
        ];

        // State Variables
        let currentStage = 1;
        let selectedWord = null;
        let matchedItems = {};
        let soundEnabled = true;

        // Audio Effects using Web Audio API (No external sound files required)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'select') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {
                console.log("Audio play error", e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        // Initialize Game
        function initGame() {
            renderCards();
            renderWords();
            updateScoreUI();
        }

        function switchStage(stageNum) {
            currentStage = stageNum;
            selectedWord = null;
            
            // Tab button styles
            const btn1 = document.getElementById('btn-stage-1');
            const btn2 = document.getElementById('btn-stage-2');
            
            if (stageNum === 1) {
                btn1.className = "px-5 py-2 rounded-2xl font-bold transition shadow-md bg-yellow-400 text-slate-900 border-b-4 border-yellow-600";
                btn2.className = "px-5 py-2 rounded-2xl font-bold transition shadow-md bg-white text-slate-500 border-b-4 border-slate-200";
            } else {
                btn2.className = "px-5 py-2 rounded-2xl font-bold transition shadow-md bg-yellow-400 text-slate-900 border-b-4 border-yellow-600";
                btn1.className = "px-5 py-2 rounded-2xl font-bold transition shadow-md bg-white text-slate-500 border-b-4 border-slate-200";
            }

            renderCards();
            renderWords();
        }

        function renderCards() {
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';

            const currentLandforms = landformsData.filter(item => item.stage === currentStage);

            currentLandforms.forEach(item => {
                const isMatched = matchedItems[item.id];
                
                const cardDiv = document.createElement('div');
                cardDiv.className = `bg-white rounded-3xl p-3 card-shadow border-4 flex flex-col items-center transition duration-200 cursor-pointer ${
                    isMatched ? 'border-green-400 bg-green-50' : 'border-white hover:border-sky-300'
                }`;
                cardDiv.onclick = () => handleCardClick(item);

                cardDiv.innerHTML = `
                    <div class="w-full h-32 md:h-36 rounded-2xl overflow-hidden mb-2 bg-slate-100 flex items-center justify-center p-1">
                        ${item.svg}
                    </div>
                    <div class="w-full text-center py-2 px-1 rounded-xl font-bold transition min-h-[48px] flex flex-col items-center justify-center ${
                        isMatched ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-400 border-2 border-dashed border-slate-300'
                    }">
                        ${isMatched 
                            ? `<span class="text-base">${item.title}</span><span class="text-xs opacity-90">${item.enTitle}</span>` 
                            : `<span class="text-xs font-normal">点击这儿填入名称</span>`
                        }
                    </div>
                `;
                grid.appendChild(cardDiv);
            });
        }

        function renderWords() {
            const wordBank = document.getElementById('word-bank');
            wordBank.innerHTML = '';

            const currentLandforms = landformsData.filter(item => item.stage === currentStage);
            
            // Shuffle array for choices
            const shuffled = [...currentLandforms].sort(() => Math.random() - 0.5);

            shuffled.forEach(item => {
                const isMatched = matchedItems[item.id];
                if (isMatched) return; // Hide solved words

                const btn = document.createElement('button');
                const isSelected = selectedWord && selectedWord.id === item.id;

                btn.className = `px-4 py-2.5 rounded-2xl font-bold text-sm md:text-base transition duration-150 flex flex-col items-center border-b-4 ${
                    isSelected 
                        ? 'bg-sky-500 text-white border-sky-700 scale-105 ring-4 ring-sky-200' 
                        : 'bg-amber-100 hover:bg-amber-200 text-amber-900 border-amber-300'
                }`;

                btn.onclick = () => {
                    playSound('select');
                    selectedWord = item;
                    renderWords();
                };

                btn.innerHTML = `
                    <span>${item.title}</span>
                    <span class="text-xs opacity-75 font-normal italic">${item.enTitle}</span>
                `;
                wordBank.appendChild(btn);
            });

            if (wordBank.children.length === 0) {
                wordBank.innerHTML = `<span class="text-green-600 font-bold py-2">✨ 本关卡全部成功完成啦！✨</span>`;
            }
        }

        function handleCardClick(targetLandform) {
            if (matchedItems[targetLandform.id]) return; // Already solved

            if (!selectedWord) {
                playSound('wrong');
                alert('请先在下方点击选择一个【地形名称】哦！');
                return;
            }

            if (selectedWord.id === targetLandform.id) {
                // Correct Match!
                playSound('correct');
                matchedItems[targetLandform.id] = true;
                selectedWord = null;
                
                updateScoreUI();
                renderCards();
                renderWords();

                // Check Victory condition
                if (Object.keys(matchedItems).length === landformsData.length) {
                    setTimeout(triggerVictory, 500);
                } else if (Object.keys(matchedItems).filter(k => landformsData.find(x => x.id === k).stage === currentStage).length === 4) {
                    // Stage completed prompt
                    if (currentStage === 1) {
                        setTimeout(() => {
                            switchStage(2);
                        }, 600);
                    }
                }
            } else {
                // Wrong Match
                playSound('wrong');
                // Shake screen effect
                document.getElementById('cards-grid').classList.add('shake-error');
                setTimeout(() => {
                    document.getElementById('cards-grid').classList.remove('shake-error');
                }, 400);
            }
        }

        function updateScoreUI() {
            const count = Object.keys(matchedItems).length;
            document.getElementById('star-count').innerText = `${count} / ${landformsData.length}`;
        }

        function restartGame() {
            matchedItems = {};
            selectedWord = null;
            document.getElementById('victory-modal').classList.add('hidden');
            switchStage(1);
        }

        function triggerVictory() {
            document.getElementById('victory-modal').classList.remove('hidden');
            
            // Launch Confetti animation
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#facc15', '#a855f7'];

            for (let i = 0; i < 100; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 5 + 2,
                    angle: Math.random() * 360
                });
            }

            function drawConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();

                    p.y += p.speed;
                    p.angle += 0.05;
                    if (p.y > canvas.height) p.y = -10;
                });

                if (!document.getElementById('victory-modal').classList.contains('hidden')) {
                    requestAnimationFrame(drawConfetti);
                }
            }
            drawConfetti();
        }

        // Initialize on window load
        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
